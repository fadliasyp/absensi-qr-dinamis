<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Admin Absensi</title>
    <link rel="icon" type="image/jpeg" href="/logo-absenku.jpeg" />
    <link rel="apple-touch-icon" href="/logo-absenku.jpeg" />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Arial, sans-serif;
        background:
          radial-gradient(
            circle at top left,
            rgba(37, 99, 235, 0.25),
            transparent 30%
          ),
          radial-gradient(
            circle at bottom right,
            rgba(34, 197, 94, 0.22),
            transparent 32%
          ),
          linear-gradient(135deg, #eef4ff, #f8fbff 45%, #eefaf3);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 22px;
        color: #0f172a;
      }

      .auth-wrapper {
        width: 100%;
        max-width: 980px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        align-items: center;
      }

      .hero-card {
        padding: 34px;
        border-radius: 30px;
        color: white;
        background: linear-gradient(135deg, #1d4ed8, #2563eb, #16a34a);
        box-shadow: 0 24px 55px rgba(37, 99, 235, 0.28);
        min-height: 430px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
        position: relative;
      }

      .hero-card::after {
        content: "";
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.16);
        position: absolute;
        right: -70px;
        bottom: -70px;
      }

      .badge {
        display: inline-flex;
        width: fit-content;
        padding: 9px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
        font-weight: 800;
        font-size: 13px;
      }

      .hero-title {
        font-size: 42px;
        line-height: 1.08;
        font-weight: 900;
        margin: 26px 0 14px;
        letter-spacing: -0.04em;
      }

      .hero-text {
        font-size: 16px;
        line-height: 1.7;
        opacity: 0.95;
      }

      .hero-mini {
        font-size: 13px;
        line-height: 1.6;
        opacity: 0.9;
      }

      .auth-card {
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 30px;
        padding: 34px;
        box-shadow: 0 24px 55px rgba(15, 23, 42, 0.12);
        backdrop-filter: blur(10px);
      }

      h1 {
        margin: 0;
        font-size: 34px;
        line-height: 1.15;
        font-weight: 900;
        letter-spacing: -0.035em;
      }

      .subtitle {
        color: #64748b;
        margin: 12px 0 26px;
        line-height: 1.7;
      }

      label {
        display: block;
        font-size: 14px;
        font-weight: 800;
        color: #334155;
        margin-bottom: 8px;
      }

      input {
        width: 100%;
        min-height: 52px;
        padding: 14px 16px;
        border-radius: 16px;
        border: 1.5px solid #dbe3f0;
        background: #f9fbff;
        font-size: 15px;
        outline: none;
        margin-bottom: 16px;
        transition: 0.2s ease;
      }

      input:focus {
        border-color: #2563eb;
        background: white;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
      }

      button {
        width: 100%;
        min-height: 52px;
        border: none;
        border-radius: 16px;
        color: white;
        font-size: 16px;
        font-weight: 900;
        cursor: pointer;
        background: linear-gradient(135deg, #1d4ed8, #2563eb, #3b82f6);
        box-shadow: 0 16px 30px rgba(37, 99, 235, 0.25);
      }

      button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .message {
        display: none;
        margin-top: 16px;
        padding: 14px 16px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.5;
        font-weight: 700;
      }

      .message.success {
        display: block;
        background: #e9fdf0;
        color: #15803d;
        border: 1px solid #bbf7d0;
      }

      .message.error {
        display: block;
        background: #fff1f2;
        color: #be123c;
        border: 1px solid #fecdd3;
      }

      .auth-link {
        margin-top: 20px;
        text-align: center;
        color: #64748b;
        font-size: 14px;
      }

      .auth-link a {
        color: #2563eb;
        font-weight: 900;
        text-decoration: none;
      }

      @media (max-width: 820px) {
        .auth-wrapper {
          grid-template-columns: 1fr;
        }

        .hero-card {
          min-height: auto;
        }
      }

      @media (max-width: 520px) {
        body {
          padding: 14px;
        }

        .hero-card,
        .auth-card {
          padding: 24px 20px;
          border-radius: 24px;
        }

        .hero-title {
          font-size: 32px;
        }

        h1 {
          font-size: 30px;
        }
      }
      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 18px 0;
        color: #94a3b8;
        font-size: 13px;
        font-weight: 800;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #e2e8f0;
      }

      .google-login-btn {
        background: #ffffff;
        color: #334155;
        border: 1.5px solid #e2e8f0;
        box-shadow: 0 12px 26px rgba(15, 23, 42, 0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .google-login-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 16px 30px rgba(15, 23, 42, 0.12);
      }

      .google-icon {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #4285f4, #34a853, #fbbc05, #ea4335);
        color: white;
        font-weight: 900;
      }
    </style>
  </head>

  <body>
    <div class="auth-wrapper">
      <div class="hero-card">
        <div>
          <div class="badge">Admin Area</div>
          <div class="hero-title">
            Sistem Absensi Muda Mudi Desa Periuk Jaya
          </div>
          <div class="hero-text">Login Hanya Untuk Admin.</div>
        </div>

        <div class="hero-mini">
          Aman dengan validasi sesi dan pembatasan satu perangkat.
        </div>
      </div>

      <div class="auth-card">
        <h1>Login Admin</h1>
        <p class="subtitle">
          Masuk menggunakan akun admin untuk mengelola sistem absensi.
        </p>

        <label for="emailInput">Email</label>
        <input id="emailInput" type="email" placeholder="admin@email.com" />

        <label for="passwordInput">Password</label>
        <input
          id="passwordInput"
          type="password"
          placeholder="Masukkan password"
        />

        <button id="loginBtn" onclick="loginAdmin()">Masuk</button>

        <div class="divider">
          <span>atau</span>
        </div>

        <button
          id="googleBtn"
          type="button"
          class="google-login-btn"
          onclick="loginWithGoogle()"
        >
          <span class="google-icon">G</span>
          Masuk dengan Google
        </button>
        <div id="messageBox" class="message"></div>

        <div class="auth-link">
          Belum punya akun?
          <a href="/register.html">Daftar admin</a>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/auth-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
      function showMessage(message, type) {
        const box = document.getElementById("messageBox");
        box.textContent = message;
        box.className = `message ${type}`;
        box.style.display = "block";
      }

      function popupSuccess(message, title = "Berhasil") {
        return Swal.fire({
          icon: "success",
          title,
          text: message,
          confirmButtonText: "Oke",
          confirmButtonColor: "#2563eb",
        });
      }

      function popupError(message, title = "Gagal") {
        return Swal.fire({
          icon: "error",
          title,
          text: message,
          confirmButtonText: "Oke",
          confirmButtonColor: "#ef4444",
        });
      }

      function popupWarning(message, title = "Perhatian") {
        return Swal.fire({
          icon: "warning",
          title,
          text: message,
          confirmButtonText: "Oke",
          confirmButtonColor: "#f59e0b",
        });
      }

      async function checkAdminApprovalAndRedirect() {
        const {
          data: { session },
        } = await authClient.auth.getSession();

        if (!session) {
          return false;
        }

        const { data: adminData, error } = await authClient
          .from("admin_users")
          .select("*")
          .eq("user_id", session.user.id)
          .maybeSingle();

        if (error) {
          console.error("ADMIN CHECK ERROR:", error);
          await authClient.auth.signOut();
          await popupError("Gagal memeriksa status admin.");
          return false;
        }

        if (!adminData) {
          await authClient.auth.signOut();

          await popupWarning(
            "Akun Google ini belum terdaftar sebagai admin. Silakan daftar admin terlebih dahulu atau hubungi super admin.",
            "Akses Ditolak",
          );

          return false;
        }

        if (adminData.status === "pending") {
          await authClient.auth.signOut();

          await popupWarning(
            "Akun admin Anda sudah terdaftar, tetapi masih menunggu persetujuan super admin.",
            "Menunggu Approval",
          );

          return false;
        }

        if (adminData.status === "rejected") {
          await authClient.auth.signOut();

          await popupError(
            "Akun admin Anda ditolak oleh super admin.",
            "Akses Ditolak",
          );

          return false;
        }

        if (adminData.status !== "approved") {
          await authClient.auth.signOut();

          await popupWarning(
            "Status admin tidak valid. Silakan hubungi super admin.",
            "Akses Ditolak",
          );

          return false;
        }

        await popupSuccess(
          "Login berhasil. Anda akan diarahkan ke halaman admin.",
        );

        window.location.href = "/admin-session.html";
        return true;
      }

      async function loginAdmin() {
        const email = document.getElementById("emailInput").value.trim();
        const password = document.getElementById("passwordInput").value;
        const btn = document.getElementById("loginBtn");

        if (!email || !password) {
          popupError("Email dan password wajib diisi.");
          return;
        }

        btn.disabled = true;
        btn.textContent = "Memproses...";

        try {
          const { data, error } = await authClient.auth.signInWithPassword({
            email,
            password,
          });

          if (error) {
            console.error("LOGIN ERROR:", error);

            popupError(
              error.message || "Email atau password salah.",
              "Login Gagal",
            );

            return;
          }

          await checkAdminApprovalAndRedirect();
        } catch (error) {
          popupError("Terjadi kesalahan saat login: " + error.message);
        } finally {
          btn.disabled = false;
          btn.textContent = "Masuk";
        }
      }

      async function loginWithGoogle() {
        const googleBtn = document.getElementById("googleBtn");

        googleBtn.disabled = true;
        googleBtn.textContent = "Mengalihkan ke Google...";

        const redirectTo = `${window.location.origin}/login.html`;

        const { error } = await authClient.auth.signInWithOAuth({
          provider: "google",
          options: {
            redirectTo,
            queryParams: {
              prompt: "select_account",
            },
          },
        });

        if (error) {
          console.error("GOOGLE LOGIN ERROR:", error);

          await popupError(
            error.message || "Gagal login menggunakan Google.",
            "Login Google Gagal",
          );

          googleBtn.disabled = false;
          googleBtn.innerHTML = `<span class="google-icon">G</span> Masuk dengan Google`;
        }
      }

      async function handleGoogleRedirectResult() {
        const {
          data: { session },
        } = await authClient.auth.getSession();

        if (!session) {
          return;
        }

        await checkAdminApprovalAndRedirect();
      }

      handleGoogleRedirectResult();
    </script>
  </body>
</html>
