<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Admin Absensi</title>
    <link rel="icon" type="image/jpeg" href="/logo-absenku.jpeg" />
    <link rel="apple-touch-icon" href="/logo-absenku.jpeg" />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Arial, sans-serif;
        background:
          radial-gradient(
            circle at top right,
            rgba(124, 58, 237, 0.22),
            transparent 30%
          ),
          radial-gradient(
            circle at bottom left,
            rgba(34, 197, 94, 0.2),
            transparent 32%
          ),
          linear-gradient(135deg, #f5f3ff, #f8fbff 45%, #eefaf3);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 22px;
        color: #0f172a;
      }

      .auth-card {
        width: 100%;
        max-width: 520px;
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 30px;
        padding: 34px;
        box-shadow: 0 24px 55px rgba(15, 23, 42, 0.12);
        backdrop-filter: blur(10px);
      }

      .icon {
        width: 70px;
        height: 70px;
        border-radius: 22px;
        display: grid;
        place-items: center;
        color: white;
        font-size: 30px;
        font-weight: 900;
        background: linear-gradient(135deg, #7c3aed, #2563eb, #16a34a);
        box-shadow: 0 16px 32px rgba(124, 58, 237, 0.25);
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: 34px;
        line-height: 1.15;
        font-weight: 900;
        letter-spacing: -0.035em;
      }

      .subtitle {
        color: #64748b;
        margin: 12px 0 26px;
        line-height: 1.7;
      }

      label {
        display: block;
        font-size: 14px;
        font-weight: 800;
        color: #334155;
        margin-bottom: 8px;
      }

      input {
        width: 100%;
        min-height: 52px;
        padding: 14px 16px;
        border-radius: 16px;
        border: 1.5px solid #dbe3f0;
        background: #f9fbff;
        font-size: 15px;
        outline: none;
        margin-bottom: 16px;
        transition: 0.2s ease;
      }

      input:focus {
        border-color: #7c3aed;
        background: white;
        box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12);
      }

      button {
        width: 100%;
        min-height: 52px;
        border: none;
        border-radius: 16px;
        color: white;
        font-size: 16px;
        font-weight: 900;
        cursor: pointer;
        background: linear-gradient(135deg, #6d28d9, #7c3aed, #a855f7);
        box-shadow: 0 16px 30px rgba(124, 58, 237, 0.25);
      }

      button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .message {
        display: none;
        margin-top: 16px;
        padding: 14px 16px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.5;
        font-weight: 700;
      }

      .message.success {
        display: block;
        background: #e9fdf0;
        color: #15803d;
        border: 1px solid #bbf7d0;
      }

      .message.error {
        display: block;
        background: #fff1f2;
        color: #be123c;
        border: 1px solid #fecdd3;
      }

      .auth-link {
        margin-top: 20px;
        text-align: center;
        color: #64748b;
        font-size: 14px;
      }

      .auth-link a {
        color: #7c3aed;
        font-weight: 900;
        text-decoration: none;
      }

      .note {
        margin-top: 16px;
        padding: 14px 16px;
        border-radius: 16px;
        background: #f8fafc;
        border: 1px solid #e5e7eb;
        color: #64748b;
        font-size: 13px;
        line-height: 1.6;
      }

      @media (max-width: 520px) {
        body {
          padding: 14px;
        }

        .auth-card {
          padding: 24px 20px;
          border-radius: 24px;
        }

        h1 {
          font-size: 30px;
        }
      }
    </style>
  </head>

  <body>
    <div class="auth-card">
      <div class="icon">+</div>

      <h1>Daftar Admin</h1>
      <p class="subtitle">
        Buat akun admin untuk mengakses halaman pengelolaan absensi.
      </p>

      <label for="namaInput">Nama Lengkap</label>
      <input id="namaInput" type="text" placeholder="Contoh: Fadli Asyp" />
      <label for="emailInput">Email Admin</label>
      <input id="emailInput" type="email" placeholder="admin@email.com" />

      <label for="passwordInput">Password</label>
      <input
        id="passwordInput"
        type="password"
        placeholder="Minimal 6 karakter"
      />

      <label for="confirmPasswordInput">Ulangi Password</label>
      <input
        id="confirmPasswordInput"
        type="password"
        placeholder="Ketik ulang password"
      />
      <label for="inviteCodeInput">Kode Undangan Admin</label>
      <input
        id="inviteCodeInput"
        type="password"
        placeholder="Masukkan kode undangan admin"
      />

      <button id="registerBtn" onclick="registerAdmin()">Daftar Admin</button>

      <div id="messageBox" class="message"></div>

      <div class="note">
        Hanya pengguna dengan kode undangan yang benar yang dapat mendaftar
        sebagai admin.
      </div>

      <div class="auth-link">
        Sudah punya akun?
        <a href="/login.html">Login admin</a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/auth-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
      function showMessage(message, type) {
        const box = document.getElementById("messageBox");
        box.textContent = message;
        box.className = `message ${type}`;
        box.style.display = "block";
      }

      function popupSuccess(message, title = "Berhasil") {
        return Swal.fire({
          icon: "success",
          title,
          text: message,
          confirmButtonText: "Oke",
          confirmButtonColor: "#7c3aed",
        });
      }

      function popupError(message, title = "Gagal") {
        return Swal.fire({
          icon: "error",
          title,
          text: message,
          confirmButtonText: "Oke",
          confirmButtonColor: "#ef4444",
        });
      }

      async function registerAdmin() {
        const inviteCode = document
          .getElementById("inviteCodeInput")
          .value.trim();
        const ADMIN_INVITE_CODE = "PERIUKJAYA354";

        if (inviteCode !== ADMIN_INVITE_CODE) {
          popupError("Kode undangan admin tidak valid.");
          return;
        }

        const namaLengkap = document.getElementById("namaInput").value.trim();
        const email = document.getElementById("emailInput").value.trim();
        const password = document.getElementById("passwordInput").value;
        const confirmPassword = document.getElementById(
          "confirmPasswordInput",
        ).value;
        const btn = document.getElementById("registerBtn");

        if (!namaLengkap || !email || !password || !confirmPassword) {
          showMessage("Semua field wajib diisi.", "error");
          return;
        }

        if (password.length < 6) {
          showMessage("Password minimal 6 karakter.", "error");
          return;
        }

        if (password !== confirmPassword) {
          showMessage("Konfirmasi password tidak sama.", "error");
          return;
        }

        btn.disabled = true;
        btn.textContent = "Mendaftarkan...";

        const { data, error } = await authClient.auth.signUp({
          email,
          password,
          options: {
            data: {
              nama_lengkap: namaLengkap,
            },
          },
        });

        if (error) {
          popupError(error.message || "Gagal mendaftarkan admin.");
          btn.disabled = false;
          btn.textContent = "Daftar Admin";
          return;
        }

        await popupSuccess(
          "Registrasi berhasil. Akun admin menunggu persetujuan terlebih dahulu.",
        );

        window.location.href = "/login.html";
      }
    </script>
  </body>
</html>
