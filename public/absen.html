<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Absensi</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(
          135deg,
          #eef4ff 0%,
          #f6f9ff 48%,
          #effaf5 100%
        );
        min-height: 100vh;
        padding: 24px 16px;
        color: #1f2937;
      }

      .page {
        max-width: 470px;
        margin: 0 auto;
      }

      .header-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 15px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.95);
        box-shadow: 0 10px 24px rgba(31, 41, 55, 0.08);
        font-size: 13px;
        font-weight: 700;
        color: #2563eb;
        margin-bottom: 18px;
        backdrop-filter: blur(10px);
      }

      .card {
        position: relative;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.95);
        border-radius: 30px;
        padding: 30px 22px 24px;
        box-shadow: 0 18px 45px rgba(31, 41, 55, 0.1);
        backdrop-filter: blur(10px);
      }

      .card::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 115px;
        background: linear-gradient(
          135deg,
          rgba(59, 130, 246, 0.09),
          rgba(16, 185, 129, 0.06)
        );
        pointer-events: none;
      }

      .icon-wrap {
        position: relative;
        z-index: 1;
        width: 74px;
        height: 74px;
        border-radius: 24px;
        margin: 0 auto 8px;
        background: linear-gradient(135deg, #2563eb, #3b82f6);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 16px 30px rgba(37, 99, 235, 0.25);
        font-size: 32px;
        color: white;
      }

      .subtitle {
        text-align: center;
        color: #6b7280;
        font-size: 17px;
        line-height: 1.7;
        margin: 12px 0 28px;
      }

      .form-group {
        margin-bottom: 17px;
      }

      .label {
        display: block;
        font-size: 14px;
        font-weight: 800;
        color: #374151;
        margin-bottom: 9px;
      }

      select,
      button {
        width: 100%;
        border-radius: 18px;
        font-size: 17px;
        transition: all 0.2s ease;
      }

      select {
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        padding: 16px 18px;
        border: 1.6px solid #dbe3f0;
        background: #f9fbff;
        color: #111827;
        outline: none;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85);
      }

      select:focus {
        border-color: #60a5fa;
        background: #ffffff;
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
      }

      select:disabled {
        cursor: not-allowed;
        color: #94a3b8;
        background: #f1f5f9;
      }

      .select-wrap {
        position: relative;
      }

      .select-wrap::after {
        content: "⌄";
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 20px;
        color: #6b7280;
        pointer-events: none;
      }

      .field-hint {
        margin-top: 8px;
        font-size: 12.5px;
        color: #64748b;
        line-height: 1.5;
      }

      .message {
        margin-bottom: 18px;
        padding: 14px 16px;
        border: 1px solid #bfdbfe;
        border-radius: 16px;
        background: #eff6ff;
        color: #1e3a8a;
        line-height: 1.5;
      }

      .message[hidden] {
        display: none;
      }

      .message strong,
      .message span {
        display: block;
      }

      .message.error {
        border-color: #fecaca;
        background: #fef2f2;
        color: #991b1b;
      }

      .message.success {
        border-color: #bbf7d0;
        background: #f0fdf4;
        color: #166534;
      }

      .message.loading {
        border-color: #fde68a;
        background: #fffbeb;
        color: #92400e;
      }

      .message-retry {
        width: auto;
        margin-top: 12px;
        padding: 9px 14px;
        border: 1px solid currentColor;
        border-radius: 10px;
        background: transparent;
        color: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }

      .message-retry[hidden] {
        display: none;
      }

      button#submitBtn {
        border: none;
        padding: 17px 18px;
        margin-top: 8px;
        font-weight: 800;
        letter-spacing: 0.2px;
        cursor: pointer;
        color: white;
        background: linear-gradient(135deg, #4f7ce8, #5f95f0);
        box-shadow: 0 16px 28px rgba(79, 124, 232, 0.24);
      }

      button#submitBtn:hover {
        transform: translateY(-1px);
        box-shadow: 0 18px 30px rgba(79, 124, 232, 0.3);
      }

      button#submitBtn:disabled {
        cursor: not-allowed;
        opacity: 0.75;
        box-shadow: none;
      }

      .note {
        margin-top: 18px;
        padding: 15px 16px;
        border-radius: 18px;
        background: #f8fafc;
        border: 1px solid #e5edf6;
        color: #64748b;
        font-size: 13px;
        line-height: 1.7;
      }

      .note strong {
        color: #334155;
      }

      .footer-text {
        text-align: center;
        font-size: 12px;
        color: #94a3b8;
        margin-top: 16px;
        font-style: oblique;
      }

      .judul-utama {
        font-family: inherit;
        font-size: 40px;
        font-weight: 600;
        font-style: oblique;
        letter-spacing: 0em;
        line-height: 1.4;
        word-spacing: 0px;
        text-transform: none;
        text-decoration: underline;
        text-align: center;
        color: #5e7ac4;
        text-shadow: 5px 0px 3px #56b6c6;
        margin-bottom: 6px;
        margin-top: 17px;
      }

      @media (max-width: 480px) {
        body {
          padding: 18px 12px;
        }

        .card {
          padding: 24px 18px 20px;
          border-radius: 24px;
        }

        .subtitle {
          font-size: 16px;
        }

        select,
        button {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="header-badge">✅ Absensi Online</div>

      <div class="card">
        <div class="icon-wrap">📝</div>

        <h1 class="judul-utama">Absenku!</h1>
        <p class="subtitle">
          Silakan pilih <strong>kelompok</strong> terlebih dahulu, lalu pilih
          <strong>nama peserta</strong> untuk melakukan absensi.
        </p>

        <div
          id="messageBox"
          class="message"
          role="status"
          aria-live="polite"
          hidden
        >
          <strong id="messageTitle"></strong>
          <span id="messageText"></span>
          <button id="messageRetryBtn" class="message-retry" type="button" hidden>
            Coba Lagi
          </button>
        </div>

        <div class="form-group">
          <label class="label" for="kelompokSelect">Kelompok</label>

          <div class="select-wrap">
            <select
              id="kelompokSelect"
              onchange="handleKelompokChange()"
              disabled
            >
              <option value="">Memuat kelompok...</option>
            </select>
          </div>

          <div class="field-hint" id="kelompokHint">
            Pilih kelompok sesuai daftar yang tersedia.
          </div>
        </div>

        <div class="form-group">
          <label class="label" for="participantSelect">Nama Peserta</label>
          <div class="select-wrap">
            <select
              id="participantSelect"
              onchange="handleParticipantChange()"
              disabled
            >
              <option value="">Pilih kelompok terlebih dahulu</option>
            </select>
          </div>
          <div class="field-hint" id="participantHint">
            Pilih kelompok terlebih dahulu.
          </div>
        </div>

        <button id="submitBtn" type="button" onclick="submitAttendance()">
          Hadir
        </button>

        <div class="note">
          <strong>Catatan:</strong> Satu perangkat hanya dapat digunakan untuk
          satu kali absensi pada sesi ini.
        </div>

        <div class="footer-text">Asyp &copy; 2026</div>
      </div>
    </div>
    <!-- ==================================== -->
    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const sessionId = urlParams.get("session");
      const token = urlParams.get("token");

      let allParticipants = [];

      let kelompokList = [];
      let selectedKelompok = "";

      let filteredParticipants = [];
      let selectedParticipantId = "";
      let memoryDeviceId = "";

      function showMessage(type, message, title, retryAction) {
        const box = document.getElementById("messageBox");
        const retryBtn = document.getElementById("messageRetryBtn");

        box.className = `message ${type}`;
        document.getElementById("messageTitle").textContent = title;
        document.getElementById("messageText").textContent = message;
        retryBtn.hidden = typeof retryAction !== "function";
        retryBtn.onclick =
          typeof retryAction === "function"
            ? function () {
                hideMessage();
                retryAction();
              }
            : null;
        box.hidden = false;

        return Promise.resolve();
      }

      function hideMessage() {
        const box = document.getElementById("messageBox");
        const retryBtn = document.getElementById("messageRetryBtn");

        box.hidden = true;
        retryBtn.hidden = true;
        retryBtn.onclick = null;
      }

      function popupSuccess(message, title = "Berhasil") {
        return showMessage("success", message, title);
      }

      function popupError(message, title = "Absensi Gagal") {
        return showMessage("error", message, title);
      }

      function popupInfo(message, title = "Informasi") {
        return showMessage("info", message, title);
      }

      function showLoadingPopup(
        title = "Memproses...",
        text = "Mohon tunggu sebentar.",
      ) {
        return showMessage("loading", text, title);
      }

      /**
       * Membuat local device ID.
       * Ini disimpan di browser peserta.
       */
      function createDeviceId() {
        const cryptoApi = window.crypto || window.msCrypto;

        try {
          if (cryptoApi && typeof cryptoApi.getRandomValues === "function") {
            const values = new Uint32Array(4);
            cryptoApi.getRandomValues(values);

            return Array.prototype.map
              .call(values, (value) =>
                ("00000000" + value.toString(16)).slice(-8),
              )
              .join("-");
          }
        } catch (error) {
          // Gunakan fallback sederhana jika Web Crypto tidak dapat dipakai.
        }

        return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function getLocalDeviceId() {
        if (memoryDeviceId) return memoryDeviceId;

        try {
          const storedDeviceId = window.localStorage.getItem(
            "attendance_local_device_id",
          );

          if (storedDeviceId) {
            memoryDeviceId = storedDeviceId;
            return memoryDeviceId;
          }
        } catch (error) {
          // Cookie backend menjadi pembatas cadangan jika browser mengizinkannya.
        }

        memoryDeviceId = createDeviceId();

        try {
          window.localStorage.setItem(
            "attendance_local_device_id",
            memoryDeviceId,
          );
        } catch (error) {
          // ID memori cukup untuk request ini; cookie backend tetap dicoba.
        }

        return memoryDeviceId;
      }

      async function loadParticipants() {
        const kelompokSelect = document.getElementById("kelompokSelect");
        const participantSelect = document.getElementById("participantSelect");

        if (!sessionId || !token) {
          kelompokSelect.options[0].textContent = "Link absensi tidak valid";
          popupError(
            "Link absensi tidak lengkap. Silakan scan ulang QR yang ditampilkan admin.",
            "QR Tidak Valid",
          );
          return;
        }

        kelompokSelect.disabled = true;
        kelompokSelect.options[0].textContent = "Memuat kelompok...";
        participantSelect.disabled = true;
        showLoadingPopup(
          "Memuat Data Peserta",
          "Mohon tunggu, daftar peserta sedang disiapkan.",
        );

        try {
          const response = await fetchWithTimeout(
            `/api/participants?session=${sessionId}`,
          );
          const result = await readJsonResponse(response);

          if (!result.success) {
            kelompokSelect.options[0].textContent = "Gagal memuat kelompok";
            const canRetry = result.code !== "SESSION_NOT_FOUND";

            showMessage(
              "error",
              result.message ||
                "Daftar peserta belum dapat dimuat. Silakan coba lagi.",
              "Data Peserta Belum Tersedia",
              canRetry ? loadParticipants : null,
            );
            return;
          }

          hideMessage();

          allParticipants = result.participants || [];

          renderKelompokOptions(allParticipants);
          renderParticipants([]);

          if (allParticipants.length === 0) {
            popupInfo(
              "Belum ada peserta aktif yang dapat melakukan absensi pada sesi ini.",
              "Peserta Belum Tersedia",
            );
          }
        } catch (error) {
          kelompokSelect.options[0].textContent = "Gagal memuat kelompok";
          const isTimeout = error && error.code === "REQUEST_TIMEOUT";

          showMessage(
            "error",
            isTimeout
              ? "Server membutuhkan waktu terlalu lama. Periksa koneksi, lalu tekan Coba Lagi."
              : "Daftar peserta belum dapat dimuat. Periksa koneksi internet, lalu tekan Coba Lagi.",
            isTimeout ? "Waktu Tunggu Habis" : "Koneksi Bermasalah",
            loadParticipants,
          );
          console.error(error);
        }
      }

      function renderKelompokOptions(participants) {
        kelompokList = [
          ...new Set(
            participants
              .map((participant) => participant.kelompok)
              .filter(Boolean),
          ),
        ];

        kelompokList.sort();
        selectedKelompok = "";
        const select = document.getElementById("kelompokSelect");
        const hint = document.getElementById("kelompokHint");

        select.textContent = "";
        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = kelompokList.length
          ? "Pilih kelompok"
          : "Belum ada kelompok";
        select.appendChild(placeholder);

        kelompokList.forEach((kelompok) => {
          const totalPeserta = allParticipants.filter(
            (participant) => participant.kelompok === kelompok,
          ).length;
          const belumHadir = allParticipants.filter(
            (participant) =>
              participant.kelompok === kelompok && !participant.isPresent,
          ).length;
          const option = document.createElement("option");
          option.value = kelompok;
          option.textContent = `${kelompok} (${belumHadir}/${totalPeserta})`;
          select.appendChild(option);
        });

        select.disabled = kelompokList.length === 0;
        hint.textContent = kelompokList.length
          ? `${kelompokList.length} kelompok tersedia.`
          : "Belum ada kelompok tersedia.";
      }

      function renderParticipants(participants) {
        filteredParticipants = participants;
        const availableParticipants = filteredParticipants.filter(
          (participant) => !participant.isPresent,
        );
        const select = document.getElementById("participantSelect");
        const hint = document.getElementById("participantHint");

        select.textContent = "";
        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = selectedKelompok
          ? "Pilih nama peserta"
          : "Pilih kelompok terlebih dahulu";
        select.appendChild(placeholder);

        availableParticipants.forEach((participant) => {
          const option = document.createElement("option");
          option.value = participant.id;
          option.textContent = participant.nama || participant.name || "-";
          select.appendChild(option);
        });

        selectedParticipantId = "";
        select.disabled =
          !selectedKelompok || availableParticipants.length === 0;
        hint.textContent = !selectedKelompok
          ? "Pilih kelompok terlebih dahulu."
          : availableParticipants.length
            ? `${availableParticipants.length} peserta tersedia di kelompok ${selectedKelompok}.`
            : `Semua peserta di kelompok ${selectedKelompok} sudah tercatat hadir.`;
      }

      function handleKelompokChange() {
        selectedKelompok = document.getElementById("kelompokSelect").value;
        selectedParticipantId = "";
        filterParticipantsByKelompok();

        if (!selectedKelompok) return;

        const totalPeserta = allParticipants.filter(
          (participant) => participant.kelompok === selectedKelompok,
        ).length;
        const belumHadir = filteredParticipants.filter(
          (participant) => !participant.isPresent,
        ).length;

        document.getElementById("kelompokHint").textContent =
          `${belumHadir} dari ${totalPeserta} peserta masih bisa absen.`;
      }

      function handleParticipantChange() {
        selectedParticipantId =
          document.getElementById("participantSelect").value;

        if (selectedParticipantId) {
          document.getElementById("participantHint").textContent =
            `Kelompok ${selectedKelompok} dipilih.`;
        }
      }

      function filterParticipantsByKelompok() {
        if (!selectedKelompok) {
          renderParticipants([]);
          return;
        }

        const filtered = allParticipants.filter((participant) => {
          const kelompokPeserta = participant.kelompok || "";
          return kelompokPeserta === selectedKelompok;
        });

        renderParticipants(filtered);
      }

      function fetchWithTimeout(url, options, timeoutMs = 20000) {
        return new Promise(function (resolve, reject) {
          const timeoutId = setTimeout(function () {
            const error = new Error("Waktu tunggu server habis.");
            error.code = "REQUEST_TIMEOUT";
            reject(error);
          }, timeoutMs);

          fetch(url, options).then(
            function (response) {
              clearTimeout(timeoutId);
              resolve(response);
            },
            function (error) {
              clearTimeout(timeoutId);
              reject(error);
            },
          );
        });
      }

      async function readJsonResponse(response) {
        const contentType = response.headers.get("content-type") || "";

        if (!contentType.includes("application/json")) {
          const text = await response.text();

          throw new Error(
            "Server sedang bermasalah. Silakan coba beberapa saat lagi.",
          );
        }

        return await response.json();
      }

      async function submitAttendance() {
        const submitBtn = document.getElementById("submitBtn");

        if (!sessionId || !token) {
          popupError("Link absensi tidak valid. Silakan scan QR terbaru.");
          return;
        }

        if (!selectedKelompok) {
          popupInfo(
            "Silakan pilih kelompok terlebih dahulu.",
            "Pilih Kelompok",
          );
          return;
        }

        if (!selectedParticipantId) {
          popupInfo(
            "Silakan pilih nama peserta terlebih dahulu.",
            "Pilih Peserta",
          );
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Menyimpan...";

        try {
          const localDeviceId = getLocalDeviceId();

          showLoadingPopup(
            "Menyimpan Absensi",
            "Sedang memproses kehadiran...",
          );

          const response = await fetchWithTimeout("/api/attendance", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              sessionId,
              token,
              participantId: selectedParticipantId,
              localDeviceId,
            }),
          });

          const result = await readJsonResponse(response);

          hideMessage();

          if (!result.success) {
            const message = result.message || "Gagal menyimpan absensi.";
            const code = result.code || "";
            const lowerMessage = message.toLowerCase();

            if (
              code === "DEVICE_ALREADY_USED" ||
              code === "PARTICIPANT_ALREADY_PRESENT" ||
              code === "ATTENDANCE_ALREADY_RECORDED" ||
              lowerMessage.includes("sudah") ||
              lowerMessage.includes("perangkat")
            ) {
              await popupInfo(message, "Absensi Sudah Tercatat");
            } else if (
              [
                "SESSION_CHECK_FAILED",
                "TOKEN_CHECK_FAILED",
                "PARTICIPANT_CHECK_FAILED",
                "ATTENDANCE_CHECK_FAILED",
                "ATTENDANCE_SAVE_FAILED",
                "ATTENDANCE_SERVER_ERROR",
              ].indexOf(code) !== -1
            ) {
              showMessage(
                "error",
                message,
                "Absensi Belum Tersimpan",
                submitAttendance,
              );
            } else {
              popupError(message);
            }

            submitBtn.disabled = false;
            submitBtn.textContent = "Hadir";
            return;
          }

          const gender = (result.data.gender || "").toLowerCase();

          let ucapanTerimaKasih = "Alhamdulillah Jazakumullahu Khoiroh";

          if (gender.includes("laki")) {
            ucapanTerimaKasih = "Alhamdulillah Jazakallahu Khoiroh";
          } else if (gender.includes("perempuan")) {
            ucapanTerimaKasih = "Alhamdulillah Jazakillahu Khoiroh";
          }

          await popupSuccess(
            `${result.message} ${ucapanTerimaKasih}, ${result.data.name} 😊`,
            "Absensi Berhasil",
          );

          submitBtn.disabled = true;
          submitBtn.textContent = "Sudah Absen";
        } catch (error) {
          const isTimeout = error && error.code === "REQUEST_TIMEOUT";

          showMessage(
            "error",
            isTimeout
              ? "Server belum memberi jawaban. Tunggu beberapa detik, lalu tekan Coba Lagi dengan nama yang sama. Jika sudah tersimpan, sistem akan memberi tahu bahwa absensi sudah tercatat."
              : "Absensi belum mendapat jawaban dari server. Periksa koneksi internet, lalu tekan Coba Lagi.",
            isTimeout ? "Waktu Tunggu Habis" : "Koneksi Bermasalah",
            submitAttendance,
          );

          submitBtn.disabled = false;
          submitBtn.textContent = "Hadir";
        }
      }

      loadParticipants();
    </script>
  </body>
</html>
