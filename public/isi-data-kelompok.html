<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Isi Data Peserta Kelompok</title>
    <style>
      :root {
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --green: #16a34a;
        --red: #dc2626;
        --dark: #0f172a;
        --muted: #64748b;
        --line: #dbe3ef;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 14px 10px 38px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        color: var(--dark);
        background:
          radial-gradient(circle at top left, #dbeafe 0, transparent 36%),
          #f8fafc;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .page {
        width: min(760px, 100%);
        margin: auto;
      }

      .hero {
        padding: 23px;
        border-radius: 26px;
        color: #ffffff;
        background: linear-gradient(135deg, #1d4ed8, #60a5fa);
        box-shadow: 0 18px 45px rgba(37, 99, 235, 0.22);
      }

      .eyebrow {
        margin: 0 0 5px;
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        opacity: 0.86;
      }

      .hero h1 {
        margin: 0;
        font-size: clamp(26px, 8vw, 40px);
      }

      .progress-wrap {
        margin-top: 18px;
      }

      .progress-label {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 7px;
        font-size: 13px;
        font-weight: 800;
      }

      .progress-track {
        overflow: hidden;
        height: 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.27);
      }

      .progress-bar {
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: #ffffff;
        transition: width 0.2s ease;
      }

      .toolbar {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        margin: 15px 0;
      }

      .search {
        width: 100%;
        min-height: 48px;
        padding: 11px 14px;
        border: 1.5px solid #cbd5e1;
        border-radius: 16px;
        color: var(--dark);
        background: #ffffff;
        outline: none;
      }

      .search:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
      }

      .filter-toggle {
        display: flex;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #ffffff;
      }

      .filter-toggle button {
        min-height: 38px;
        padding: 8px 11px;
        border: 0;
        border-radius: 12px;
        color: var(--muted);
        background: transparent;
        font-size: 12px;
        font-weight: 850;
      }

      .filter-toggle button.active {
        color: #ffffff;
        background: var(--primary);
      }

      .participant-list {
        display: grid;
        gap: 12px;
      }

      .participant-card {
        padding: 17px;
        border: 1px solid var(--line);
        border-radius: 21px;
        background: #ffffff;
        box-shadow: 0 10px 28px rgba(15, 23, 42, 0.07);
      }

      .participant-card.complete {
        border-color: #86efac;
        background: linear-gradient(180deg, #ffffff, #f0fdf4);
      }

      .participant-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 14px;
      }

      .participant-name {
        margin: 0;
        font-size: 19px;
        font-weight: 900;
      }

      .participant-gender {
        margin-top: 4px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 750;
      }

      .complete-mark {
        display: grid;
        place-items: center;
        width: 31px;
        height: 31px;
        flex: 0 0 31px;
        border-radius: 50%;
        color: #ffffff;
        background: var(--green);
        font-weight: 950;
      }

      .field-list {
        display: grid;
        gap: 10px;
      }

      .field-label {
        display: block;
        margin-bottom: 6px;
        color: #475569;
        font-size: 12px;
        font-weight: 900;
      }

      .required {
        color: var(--red);
      }

      .value-button {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        width: 100%;
        min-height: 49px;
        padding: 11px 13px;
        border: 1.5px solid #bfdbfe;
        border-radius: 15px;
        color: var(--primary-dark);
        background: #eff6ff;
        font-weight: 850;
        text-align: left;
      }

      .value-button.filled {
        border-color: #86efac;
        color: #166534;
        background: #f0fdf4;
      }

      .value-button.invalid {
        border-color: #fdba74;
        color: #9a3412;
        background: #fff7ed;
      }

      .value-button:disabled {
        opacity: 0.65;
        cursor: wait;
      }

      .empty,
      .error-card {
        padding: 24px;
        border: 1px dashed #cbd5e1;
        border-radius: 20px;
        color: var(--muted);
        background: #ffffff;
        text-align: center;
        font-weight: 750;
        line-height: 1.6;
      }

      .error-card {
        margin-top: 15px;
        border-color: #fecaca;
        color: #b91c1c;
        background: #fff1f2;
      }

      .sheet-backdrop {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: flex-end;
        padding: 12px;
        background: rgba(15, 23, 42, 0.55);
      }

      .sheet-backdrop.open {
        display: flex;
      }

      .sheet {
        width: min(620px, 100%);
        max-height: min(78dvh, 650px);
        margin: 0 auto;
        overflow-y: auto;
        border-radius: 25px;
        background: #ffffff;
        box-shadow: 0 25px 70px rgba(15, 23, 42, 0.28);
      }

      .sheet-head {
        position: sticky;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 17px;
        border-bottom: 1px solid var(--line);
        background: #ffffff;
      }

      .sheet-title {
        margin: 0;
        font-size: 19px;
        font-weight: 900;
      }

      .close-sheet {
        width: 42px;
        height: 42px;
        border: 0;
        border-radius: 14px;
        color: var(--primary-dark);
        background: #dbeafe;
        font-size: 23px;
        font-weight: 900;
      }

      .sheet-options {
        display: grid;
        gap: 9px;
        padding: 15px;
      }

      .option-button {
        width: 100%;
        min-height: 54px;
        padding: 12px 14px;
        border: 1.5px solid var(--line);
        border-radius: 16px;
        color: var(--dark);
        background: #ffffff;
        font-weight: 850;
        text-align: left;
      }

      .option-button.selected {
        border-color: var(--primary);
        color: var(--primary-dark);
        background: #eff6ff;
      }

      .option-button.clear-option {
        color: var(--muted);
        background: #f8fafc;
      }

      .toast {
        position: fixed;
        z-index: 30;
        left: 50%;
        bottom: 24px;
        display: none;
        max-width: calc(100% - 24px);
        padding: 12px 16px;
        transform: translateX(-50%);
        border-radius: 14px;
        color: #ffffff;
        background: #15803d;
        box-shadow: 0 14px 36px rgba(15, 23, 42, 0.2);
        font-size: 14px;
        font-weight: 850;
        text-align: center;
      }

      .toast.error {
        background: var(--red);
      }

      @media (max-width: 560px) {
        .toolbar {
          grid-template-columns: 1fr;
        }

        .filter-toggle button {
          flex: 1;
        }

        .hero,
        .participant-card {
          border-radius: 20px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <p class="eyebrow">Database Peserta Kelompok</p>
        <h1 id="groupName">Memuat...</h1>
        <div class="progress-wrap">
          <div class="progress-label">
            <span>Data lengkap</span>
            <span id="progressText">0 dari 0</span>
          </div>
          <div class="progress-track">
            <div id="progressBar" class="progress-bar"></div>
          </div>
        </div>
      </section>

      <section id="controls" class="toolbar" hidden>
        <input
          id="searchInput"
          class="search"
          type="search"
          placeholder="Cari nama peserta"
          autocomplete="off"
        />
        <div class="filter-toggle" role="group" aria-label="Filter peserta">
          <button id="allFilter" class="active" type="button">Semua</button>
          <button id="incompleteFilter" type="button">Belum lengkap</button>
        </div>
      </section>

      <section id="participantList" class="participant-list">
        <div class="empty">Memuat peserta...</div>
      </section>
    </main>

    <div id="pickerBackdrop" class="sheet-backdrop" role="presentation">
      <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
        <div class="sheet-head">
          <h2 id="pickerTitle" class="sheet-title">Pilih</h2>
          <button id="closePickerBtn" class="close-sheet" type="button" aria-label="Tutup">×</button>
        </div>
        <div id="pickerOptions" class="sheet-options"></div>
      </section>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
      const accessToken = new URLSearchParams(location.hash.slice(1)).get("token") || "";
      let participants = [];
      let fields = [];
      let values = new Map();
      let activeFilter = "all";
      let activePicker = null;
      let toastTimer = null;

      function safeText(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function valueKey(participantId, fieldId) {
        return `${participantId}:${fieldId}`;
      }

      function currentValue(participantId, fieldId) {
        return values.get(valueKey(participantId, fieldId)) || "";
      }

      function isValidValue(field, value) {
        return Boolean(value && (field.options || []).includes(value));
      }

      function completionFields() {
        const requiredFields = fields.filter((field) => field.is_required);
        return requiredFields.length ? requiredFields : fields;
      }

      function isComplete(participant) {
        const checkedFields = completionFields();
        return (
          checkedFields.length > 0 &&
          checkedFields.every((field) =>
            isValidValue(field, currentValue(participant.id, field.id)),
          )
        );
      }

      function showToast(message, type = "success") {
        const toast = document.getElementById("toast");
        clearTimeout(toastTimer);
        toast.textContent = message;
        toast.className = `toast${type === "error" ? " error" : ""}`;
        toast.style.display = "block";
        toastTimer = setTimeout(() => {
          toast.style.display = "none";
        }, 2200);
      }

      function updateProgress() {
        const completed = participants.filter(isComplete).length;
        const total = participants.length;
        const percent = total ? Math.round((completed / total) * 100) : 0;
        document.getElementById("progressText").textContent = `${completed} dari ${total}`;
        document.getElementById("progressBar").style.width = `${percent}%`;
      }

      function closePicker() {
        activePicker = null;
        document.getElementById("pickerBackdrop").classList.remove("open");
        document.body.style.overflow = "";
      }

      function openPicker(participant, field) {
        const current = currentValue(participant.id, field.id);
        activePicker = { participant, field };
        document.getElementById("pickerTitle").textContent = field.label;
        const box = document.getElementById("pickerOptions");
        box.innerHTML = "";

        (field.options || []).forEach((option) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `option-button${option === current ? " selected" : ""}`;
          button.textContent = option;
          button.addEventListener("click", () => saveValue(participant, field, option));
          box.appendChild(button);
        });

        if (current) {
          const clearButton = document.createElement("button");
          clearButton.type = "button";
          clearButton.className = "option-button clear-option";
          clearButton.textContent = "Kosongkan pilihan";
          clearButton.addEventListener("click", () => saveValue(participant, field, ""));
          box.appendChild(clearButton);
        }

        document.getElementById("pickerBackdrop").classList.add("open");
        document.body.style.overflow = "hidden";
      }

      async function saveValue(participant, field, value) {
        closePicker();
        const key = valueKey(participant.id, field.id);
        const previousValue = values.get(key) || "";
        if (value) values.set(key, value);
        else values.delete(key);
        renderParticipants();

        const button = document.querySelector(
          `[data-participant-id="${participant.id}"][data-field-id="${field.id}"]`,
        );
        if (button) {
          button.disabled = true;
          button.querySelector(".button-value").textContent = "Menyimpan...";
        }

        try {
          const response = await fetch("/api/group-participant-database/value", {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              "X-Group-Access-Token": accessToken,
            },
            body: JSON.stringify({
              participant_id: participant.id,
              field_id: field.id,
              value,
            }),
          });
          const result = await response.json();
          if (!response.ok || !result.success) {
            throw new Error(result.message || "Pilihan gagal disimpan.");
          }

          showToast("Tersimpan");
        } catch (error) {
          if (previousValue) values.set(key, previousValue);
          else values.delete(key);
          showToast(error.message, "error");
        } finally {
          renderParticipants();
        }
      }

      function renderParticipants() {
        const box = document.getElementById("participantList");
        const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
        let visible = participants.filter((participant) =>
          String(participant.nama || "").toLowerCase().includes(keyword),
        );

        if (activeFilter === "incomplete") {
          visible = visible.filter((participant) => !isComplete(participant));
        }

        updateProgress();
        box.innerHTML = "";

        if (!fields.length) {
          box.innerHTML = '<div class="empty">Belum ada field yang perlu diisi.</div>';
          return;
        }

        if (!visible.length) {
          box.innerHTML = '<div class="empty">Tidak ada peserta pada daftar ini.</div>';
          return;
        }

        visible.forEach((participant) => {
          const complete = isComplete(participant);
          const card = document.createElement("article");
          card.className = `participant-card${complete ? " complete" : ""}`;
          card.innerHTML = `
            <div class="participant-head">
              <div>
                <h2 class="participant-name">${safeText(participant.nama || "-")}</h2>
                <div class="participant-gender">${safeText(participant.gender || "Gender belum diisi")}</div>
              </div>
              ${complete ? '<span class="complete-mark" aria-label="Data lengkap">✓</span>' : ""}
            </div>
            <div class="field-list"></div>
          `;

          const fieldList = card.querySelector(".field-list");
          fields.forEach((field) => {
            const value = currentValue(participant.id, field.id);
            const valid = isValidValue(field, value);
            const row = document.createElement("div");
            row.innerHTML = `
              <span class="field-label">
                ${safeText(field.label)}${field.is_required ? '<span class="required"> *</span>' : ""}
              </span>
              <button
                class="value-button${valid ? " filled" : value ? " invalid" : ""}"
                type="button"
                data-participant-id="${safeText(participant.id)}"
                data-field-id="${safeText(field.id)}"
              >
                <span class="button-value">${safeText(valid ? value : value ? "Pilih ulang" : "Pilih")}</span>
                <span>${valid ? "✓" : "›"}</span>
              </button>
            `;
            row.querySelector("button").addEventListener("click", () => openPicker(participant, field));
            fieldList.appendChild(row);
          });

          box.appendChild(card);
        });
      }

      function setFilter(filter) {
        activeFilter = filter;
        document.getElementById("allFilter").classList.toggle("active", filter === "all");
        document.getElementById("incompleteFilter").classList.toggle("active", filter === "incomplete");
        renderParticipants();
      }

      async function loadData() {
        if (!accessToken) {
          document.getElementById("participantList").innerHTML =
            '<div class="error-card">Link kelompok tidak lengkap. Minta link baru kepada admin.</div>';
          return;
        }

        try {
          const response = await fetch("/api/group-participant-database", {
            headers: { "X-Group-Access-Token": accessToken },
          });
          const result = await response.json();
          if (!response.ok || !result.success) {
            throw new Error(result.message || "Data kelompok gagal dimuat.");
          }

          participants = result.participants || [];
          fields = result.fields || [];
          values = new Map(
            (result.values || []).map((item) => [
              valueKey(item.participant_id, item.field_id),
              item.value,
            ]),
          );
          document.getElementById("groupName").textContent = result.group?.name || "Kelompok";
          document.getElementById("controls").hidden = false;
          renderParticipants();
        } catch (error) {
          document.getElementById("groupName").textContent = "Link Tidak Tersedia";
          document.getElementById("participantList").innerHTML =
            `<div class="error-card">${safeText(error.message)}</div>`;
        }
      }

      document.getElementById("searchInput").addEventListener("input", renderParticipants);
      document.getElementById("allFilter").addEventListener("click", () => setFilter("all"));
      document.getElementById("incompleteFilter").addEventListener("click", () => setFilter("incomplete"));
      document.getElementById("closePickerBtn").addEventListener("click", closePicker);
      document.getElementById("pickerBackdrop").addEventListener("click", (event) => {
        if (event.target.id === "pickerBackdrop") closePicker();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closePicker();
      });

      loadData();
    </script>
  </body>
</html>
